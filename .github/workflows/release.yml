name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select unique release tags
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "APP_IMAGE=ghcr.io/${repository}/api:${release}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${repository}/web:${release}" >> "$GITHUB_ENV"
      - name: Build the release pair
        run: |
          docker build --target runtime --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$APP_IMAGE" .
          docker build -f deploy/frontend.Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$WEB_IMAGE" .
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify these exact images before publishing
        run: python scripts/deployment_smoke.py --skip-build --api-image "$APP_IMAGE" --web-image "$WEB_IMAGE"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and record immutable references
        run: |
          docker push "$APP_IMAGE"
          docker push "$WEB_IMAGE"
          python scripts/release_manifest.py --api-image "$APP_IMAGE" --web-image "$WEB_IMAGE" --commit "$GITHUB_SHA" --output release.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release.json
            compose.production.yaml
            compose.existing-nginx.yaml
            compose.pilot.yaml
            deploy/Caddyfile.behind-nginx
            deploy/init-app-db.sh
            scripts/release_deploy.py
            scripts/release_manifest.py
            scripts/database_backup.py
            scripts/ci_deploy.py
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact
      - name: Deploy the tested release over pinned SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/ssh_release.py --artifact release-artifact
          --release-id "$RELEASE_ID" --commit "$RELEASE_COMMIT"
          --repository "$RELEASE_REPOSITORY"
