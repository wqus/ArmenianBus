name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: armeniabus_test
          POSTGRES_USER: armeniabus
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armeniabus -d armeniabus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://armeniabus:local-test-only@localhost:5432/armeniabus_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-at-least-32-characters-long
      RUN_DB_TESTS: "1"
      AUTH_RATE_LIMIT_PER_MINUTE: "100"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check src tests migrations scripts
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose -f compose.production.yaml --env-file .env.production.example config --quiet
      - run: docker build --target runtime -t armeniabus-api:ci .
