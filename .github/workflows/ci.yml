name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: armeniabus_test
          POSTGRES_USER: armeniabus
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armeniabus -d armeniabus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://armeniabus:local-test-only@localhost:5432/armeniabus_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-at-least-32-characters-long
      RUN_DB_TESTS: "1"
      AUTH_RATE_LIMIT_PER_MINUTE: "100"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check src tests migrations scripts
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose -f compose.production.yaml --env-file .env.production.example config --quiet
      - run: docker compose -f compose.production.yaml -f compose.existing-nginx.yaml --env-file .env.production.example config --quiet
        env:
          INGRESS_PROXY_IP: 172.18.0.2
      - run: docker compose -p armeniabus-staging -f compose.production.yaml --env-file .env.staging.example config --quiet
      - run: docker run --rm -e APP_DOMAIN=bus.example.invalid -e INGRESS_PROXY_IP=172.18.0.2 -v "$PWD/deploy/Caddyfile.behind-nginx:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build --target runtime -t armeniabus-api:ci .

  frontend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-browser-test-secret-at-least-32-characters
      API_PROXY_TARGET: http://127.0.0.1:8001
      RUN_AUTH_E2E: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: docker compose -p armeniabus-auth-e2e --profile test build api-e2e test
        working-directory: .
      - run: docker compose -p armeniabus-auth-e2e --profile test run --rm test alembic upgrade head
        working-directory: .
      - run: docker compose -p armeniabus-auth-e2e --profile test up -d --wait api-e2e
        working-directory: .
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:browsers
      - if: always()
        run: docker compose -p armeniabus-auth-e2e --profile test down --volumes
        working-directory: .

  deployment-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/deployment_smoke.py --release-drill
