x-payment-environment: &payment-environment
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  YOOKASSA_TEST_MODE: ${YOOKASSA_TEST_MODE:-true}
  PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost:5173/payment/result}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-armeniabus}
      POSTGRES_USER: ${POSTGRES_USER:-armeniabus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *payment-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-armeniabus}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-armeniabus}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-10}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "armeniabus.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-armeniabus}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-armeniabus}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      HOLD_WORKER_INTERVAL_SECONDS: ${HOLD_WORKER_INTERVAL_SECONDS:-5}
      HOLD_WORKER_BATCH_SIZE: ${HOLD_WORKER_BATCH_SIZE:-500}
    depends_on:
      db:
        condition: service_healthy

  payment-worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "armeniabus.modules.payments.worker"]
    restart: unless-stopped
    environment:
      <<: *payment-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-armeniabus}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-armeniabus}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+asyncpg://armeniabus:test-only-password@db-test:5432/armeniabus_test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      RUN_DB_TESTS: "1"
      AUTH_RATE_LIMIT_PER_MINUTE: "100"
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  db-test:
    profiles: [test]
    image: postgres:17
    environment:
      POSTGRES_DB: armeniabus_test
      POSTGRES_USER: armeniabus
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "armeniabus", "-d", "armeniabus_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    profiles: [test]
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
